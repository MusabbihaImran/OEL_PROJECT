<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hotel Web App{% endblock %}</title>
    <style>
        :root {
            --bg-color: #1A1A2E;
            --accent-color: #E94560;
            --text-color: #FFFFFF;
            --card-bg: #16213E;
            --navbar-bg: #0F3460;
            --available: #4CAF50;
            --maintenance: #FF9800;
            --occupied: #F44336;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Navbar Styles */
        nav {
            background-color: var(--navbar-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links li a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .nav-links li a:hover {
            color: var(--accent-color);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Status Badges */
        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: capitalize;
        }

        .badge.available { background-color: var(--available); color: white; }
        .badge.maintenance { background-color: var(--maintenance); color: white; }
        .badge.occupied, .badge.cancelled { background-color: var(--occupied); color: white; }
        
        .badge.confirmed, .badge.checked_in { background-color: #2196F3; color: white; }
        .badge.checked_out { background-color: #9E9E9E; color: white; }

        .badge.paid { background-color: var(--available); color: white; }
        .badge.pending { background-color: var(--maintenance); color: white; }
        
        /* Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
            border-top: 4px solid var(--accent-color);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0 0 1rem 0;
            color: #ccc;
            font-size: 1.2rem;
        }

        .card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 0;
        }

    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">HotelAdmin</a>
        <ul class="nav-links">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/rooms">Rooms</a></li>
            <li><a href="/bookings">Bookings</a></li>
            <li><a href="/billing">Billing</a></li>
            <li><a href="/feedback">Feedback</a></li>
        </ul>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
